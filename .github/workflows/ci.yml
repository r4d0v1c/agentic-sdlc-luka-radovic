name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
    paths:
      - "src/**"
      - "tests/**"
      - "Dockerfile"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "Dockerfile"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: |
          pip install --no-cache-dir \
            black==25.1.0 \
            isort==6.0.1 \
            ruff==0.11.4

      - name: black
        run: black --check .

      - name: isort
        run: isort --check-only .

      - name: ruff
        run: ruff check .

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t kata-tests .

      - name: Save image to tarball
        run: docker save kata-tests -o kata-tests.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: kata-tests-image
          path: kata-tests.tar

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: kata-tests-image

      - name: Load Docker image
        run: docker load -i kata-tests.tar

      - name: Run tests
        run: docker run --rm kata-tests

  deploy:
    name: Deploy (placeholder)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy placeholder
        run: echo "Deploy step not yet implemented."
